name: afterpost

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: afterpost
      POSTGRES_PASSWORD: afterpost
      POSTGRES_DB: afterpost
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - afterpost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterpost -d afterpost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - afterpost-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afterpost-pgdata:
  afterpost-redisdata:
